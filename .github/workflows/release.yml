name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2 desktop-file-utils \
            libgdk-pixbuf2.0-dev zsync xz-utils wget curl file

      - name: Install frontend dependencies
        run: npm install

      - name: Download Piper Binary (Sidecar)
        run: |
          mkdir -p src-tauri/binaries
          if [ ! -d src-tauri/binaries/piper ]; then
            wget -O piper.tar.gz https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
            tar -xzf piper.tar.gz
            cp -r piper src-tauri/binaries/
            chmod +x src-tauri/binaries/piper/piper
            rm -rf piper piper.tar.gz
          fi

      - name: Build deb package only (no linuxdeploy)
        run: npm run tauri:deb

      - name: Extract deb and build patched AppImage
        id: pkg
        run: |
          set -euo pipefail
          DEB_PATH=$(find ./src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          echo "Deb found: $DEB_PATH"

          APPDIR=$(mktemp -d)
          dpkg-deb -x "$DEB_PATH" "$APPDIR"

          cat <<'EOF' > "$APPDIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "${HERE}/usr/bin/fina-ergen" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat <<'EOF' > "$APPDIR/fina-seinen.desktop"
          [Desktop Entry]
          Name=Fina Seinen
          Exec=fina-ergen
          Icon=fina-seinen
          Type=Application
          Categories=Utility;
          EOF

          cp src-tauri/icons/256x256.png "$APPDIR/fina-seinen.png"
          cp src-tauri/icons/256x256.png "$APPDIR/.DirIcon"

          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          TAG_VER="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_VER" =~ ^v ]]; then
            TAG_VER="v3.6.0-manual-${GITHUB_RUN_NUMBER}"
          fi
          APPIMAGE_NAME="Fina-Seinen_${TAG_VER}_patched_amd64.AppImage"

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage --comp xz "$APPDIR" "$APPIMAGE_NAME"

          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_PATH=$APPIMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG_VER" >> "$GITHUB_OUTPUT"

      - name: Upload deb and patched AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.RELEASE_TAG }}
          name: "Fina Seinen ${{ steps.pkg.outputs.RELEASE_TAG }}"
          body: |
            ### 🚀 Fina Seinen ${{ steps.pkg.outputs.RELEASE_TAG }}

            - **`.deb`**: Paquete nativo para Debian / Ubuntu / Linux Mint.
            - **`_patched_amd64.AppImage`**: AppImage universal con compresión XZ construido directamente desde el `.deb` (sin `linuxdeploy`).
          files: |
            ${{ steps.pkg.outputs.DEB_PATH }}
            ${{ steps.pkg.outputs.APPIMAGE_PATH }}
