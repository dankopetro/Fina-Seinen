name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # -------------------------------------------------
      # DEPENDENCIAS PARA APPIMAGE
      # -------------------------------------------------
      - name: Install system deps (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2 desktop-file-utils \
            libgdk-pixbuf2.0-dev zsync xz-utils

      - name: Install frontend dependencies
        run: npm install

      # -------------------------------------------------
      # LIMPIAR SUBMÓDULOS HUERFANOS
      # -------------------------------------------------
      - name: Remove stale .gitmodules (if present)
        run: |
          if [ -f .gitmodules ]; then
            grep -v 'docs/Fina-Ergen.wiki' .gitmodules > .gitmodules.tmp
            mv .gitmodules.tmp .gitmodules
          fi

      - name: Download Piper Binary (Sidecar)
        run: |
          mkdir -p src-tauri/binaries
          if [ ! -d src-tauri/binaries/piper ]; then
            wget -O piper.tar.gz https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
            tar -xzf piper.tar.gz
            cp -r piper src-tauri/binaries/
            chmod +x src-tauri/binaries/piper/piper
            rm -rf piper piper.tar.gz
          fi

      - name: Build & bundle (deb + appimage)
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v${{ github.ref_name }}
          releaseName: "Fina Seinen v${{ github.ref_name }}"
          releaseBody: |
            ### 🚀 Fina Seinen v${{ github.ref_name }}

            - Paquetes **deb** y **AppImage** listos para instalación local.
            - El **rpm** se generará solo en la publicación pública (no en CI).
          releaseDraft: false
          prerelease: false
          args: --bundles deb,appimage