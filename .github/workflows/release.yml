name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # -------------------------------------------------
      # DEPENDENCIAS PARA APPIMAGE (solo para crear AppImage manualmente)
      # -------------------------------------------------
      - name: Install system deps (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2 desktop-file-utils \
            libgdk-pixbuf2.0-dev zsync xz-utils wget curl

      - name: Install frontend dependencies
        run: npm install

      # -------------------------------------------------
      # LIMPIAR SUBMÓDULOS HUERFANOS
      # -------------------------------------------------
      - name: Remove stale .gitmodules (if present)
        run: |
          if [ -f .gitmodules ]; then
            grep -v 'docs/Fina-Ergen.wiki' .gitmodules > .gitmodules.tmp
            mv .gitmodules.tmp .gitmodules
          fi

      - name: Download Piper Binary (Sidecar)
        run: |
          mkdir -p src-tauri/binaries
          if [ ! -d src-tauri/binaries/piper ]; then
            wget -O piper.tar.gz https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
            tar -xzf piper.tar.gz
            cp -r piper src-tauri/binaries/
            chmod +x src-tauri/binaries/piper/piper
            rm -rf piper piper.tar.gz
          fi

      - name: Build deb package (no AppImage)
        run: npm run tauri:deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract deb and build patched AppImage
        id: appimage
        run: |
          set -e
          DEB_PATH=$(find ./src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          echo "Deb found: $DEB_PATH"
          APPDIR=$(mktemp -d)
          dpkg-deb -x "$DEB_PATH" "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cat > "$APPDIR/Fina Seinen.desktop" <<EOF
[Desktop Entry]
Name=Fina Seinen
Exec=Fina-Seinen
Icon=Fina-Seinen
Type=Application
Categories=Utility;
EOF
          if [ -f "src-tauri/icons/32x32.png" ]; then
            cp src-tauri/icons/32x32.png "$APPDIR/Fina Seinen.png"
          fi
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --comp xz "$APPDIR" "Fina Seinen_${{ github.ref_name }}_amd64_patched.AppImage"
          echo "APPIMAGE_PATH=Fina Seinen_${{ github.ref_name }}_amd64_patched.AppImage" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload patched AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.ref_name }}
          files: ${{ steps.appimage.outputs.APPIMAGE_PATH }}
