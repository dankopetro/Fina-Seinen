# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        python -m pip install --quiet uv

    - name: Sync dependencies (uv)
      run: |
        uv sync --frozen   # usa el lockfile, no modifica versiones

    - name: Lint with ruff
      run: |
        uv run ruff check .

    - name: Type check with mypy
      run: |
        uv run mypy .

    # Si tienes tests con pytest, descomenta:
    # - name: Run tests
    #   run: |
    #     uv run pytest
